name: Backend CI

on:
  push:
  pull_request:

jobs:
  express:
    name: Express API Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Express backend
        run: npm run build

  risk-engine:
    name: Python Risk Engine Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/risk-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/risk-engine/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: pytest -q
