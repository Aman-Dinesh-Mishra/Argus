[project]
name = "argus"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn==1.9.0",
    "joblib",
    "shap",
    "fastapi",
    "pydantic",
    "uvicorn[standard]"
]
[project.optional-dependencies]
dev = [
    "pytest"
]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]